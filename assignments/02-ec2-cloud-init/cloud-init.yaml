#cloud-config

package_update: true
package_upgrade: false

packages:
  - nginx

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    content: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Terraform Cloud-Init Assignment</title>
          <style>
            body { background: #101827; color: #f8fafc; font-family: Arial, sans-serif; margin: 0; }
            main { max-width: 760px; margin: 12vh auto; padding: 2rem; }
            section { background: #1e293b; border-left: 6px solid #7c3aed; border-radius: 12px; padding: 2rem; }
            h1 { margin-top: 0; }
            code { color: #c4b5fd; }
          </style>
        </head>
        <body>
          <main>
            <section>
              <h1>NGINX deployed successfully</h1>
              <p>This EC2 instance was provisioned with <strong>Terraform</strong>.</p>
              <p>NGINX was installed and configured automatically by <code>cloud-init</code>.</p>
              <p>No manual server configuration was required.</p>
            </section>
          </main>
        </body>
      </html>

runcmd:
  - [systemctl, enable, nginx]
  - [systemctl, restart, nginx]
  - [sh, -c, "printf 'Cloud-init completed at %s\n' \"$(date --iso-8601=seconds)\" > /var/lib/cloud-init-nginx-complete"]

final_message: "NGINX cloud-init configuration completed after $UPTIME seconds"

